[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  # Override the homepage from package.json so assets use relative paths
  # instead of pointing to the GitHub Pages URL
  PUBLIC_URL = "/"
  NODE_VERSION = "18"

# SPA routing: redirect all paths to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"
